<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Students & Specialists — TeamForge</title>
  <meta name="description" content="Browse university students, filter by programming language, experience, rating, and hire specialists.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen relative selection:bg-indigo-500 selection:text-white">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Navbar -->
  <div id="teamforge-navbar"></div>

  <div class="max-w-7xl mx-auto flex">
    <!-- Sidebar -->
    <div id="teamforge-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 space-y-6 min-w-0">
      <!-- Header -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="font-heading text-2xl sm:text-3xl font-black text-white flex items-center gap-2.5">
            Discover Peer Builders & Specialists
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            Browse registered students across top universities. Filter and rank by tech skills, domain tracks, and reputation.
          </p>
        </div>

        <a href="ai-match.html" class="btn-gradient self-start md:self-auto px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-indigo-600/30 shrink-0">
          <span>✨ Run AI Squad Match</span>
        </a>
      </div>

      <!-- Filters & Search Controls -->
      <div class="glass-panel p-5 rounded-2xl border border-white/10 space-y-4 shadow-xl">
        <!-- Search Bar & Results Counter -->
        <div class="flex flex-col sm:flex-row items-center gap-3">
          <div class="relative flex-1 w-full">
            <input type="text" id="search-query" placeholder="Search by name, skills (e.g. Python, React, PyTorch), role, or university..." class="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-sm placeholder-slate-500">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
          <button onclick="clearAllFilters()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-white/5 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 border border-white/10 transition-colors shrink-0 w-full sm:w-auto flex items-center justify-center gap-1.5">
            <span>↺</span> Reset Filters
          </button>
        </div>

        <!-- Filter Dropdowns & Sorting -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Domain Track</label>
            <select id="filter-domain" class="glass-input w-full px-2.5 py-2 rounded-lg text-xs">
              <option value="">All Domains</option>
              <option value="Artificial Intelligence">Artificial Intelligence (AI/ML)</option>
              <option value="UI/UX & Frontend">UI/UX & Frontend</option>
              <option value="Web3 / Blockchain">Web3 / Blockchain</option>
              <option value="Robotics & Autonomous">Robotics & Vision</option>
              <option value="Cloud Infrastructure">Cloud Infrastructure & Backend</option>
              <option value="Full Stack & Web">Full Stack & Web</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1 font-medium">Sort Candidates</label>
            <select id="sort-by" class="glass-input w-full px-2.5 py-2 rounded-lg text-xs text-indigo-300 font-semibold bg-indigo-950/40 border-indigo-500/30">
              <option value="match" selected>🎯 Best Skill & Domain Match</option>
              <option value="skills">💡 Most Matching Skills</option>
              <option value="rating">⭐ Highest Rating (5.0)</option>
              <option value="credits">⚡ Reputation Credits</option>
              <option value="name">🔤 Name (A - Z)</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1 font-medium">Experience</label>
            <select id="filter-exp" class="glass-input w-full px-2.5 py-2 rounded-lg text-xs">
              <option value="">Any Experience</option>
              <option value="3+">Advanced (3+ yrs)</option>
              <option value="2">Intermediate (2 yrs)</option>
              <option value="1">Beginner (1 yr)</option>
              <option value="Champion">Hackathon Champion</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1 font-medium">Minimum Rating</label>
            <select id="filter-rating" class="glass-input w-full px-2.5 py-2 rounded-lg text-xs">
              <option value="0">Any Rating</option>
              <option value="4.5">4.5+ Stars ⭐</option>
              <option value="4.8">4.8+ Stars ⭐⭐</option>
              <option value="5.0">5.0 Stars ⭐⭐⭐</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-400 mb-1 font-medium">Availability</label>
            <select id="filter-avail" class="glass-input w-full px-2.5 py-2 rounded-lg text-xs">
              <option value="">Any Availability</option>
              <option value="15-20">15-20 hrs/week</option>
              <option value="20+">20+ hrs/week (Full Sprint)</option>
              <option value="5-10">5-10 hrs/week</option>
            </select>
          </div>
        </div>

        <!-- Quick Skill Filter Chips -->
        <div class="pt-2 border-t border-white/5 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 font-mono text-[11px]">Match by Tech Stack:</span>
            <span id="active-filter-indicator" class="text-[11px] text-indigo-300 font-mono"></span>
          </div>
          <div id="skills-chips-container" class="flex items-center gap-1.5 flex-wrap text-xs">
            <!-- Dynamically rendered chips -->
          </div>
        </div>
      </div>

      <!-- Member Directory Header Counter -->
      <div class="flex items-center justify-between px-1">
        <div class="text-xs text-slate-400 font-mono">
          <span id="directory-count" class="font-bold text-white">Loading members...</span>
        </div>
        <div id="matching-status-pill" class="hidden text-[11px] px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-mono">
          ✨ Sorted by Match
        </div>
      </div>

      <!-- Student Directory Grid -->
      <div id="students-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
        <!-- Dynamically Rendered -->
      </div>
    </main>
  </div>

  <div id="teamforge-footer"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/ui.js"></script>

  <script>
    let activeSkill = '';

    const POPULAR_SKILLS = [
      'Python', 'PyTorch', 'React', 'TypeScript', 'UI/UX Design', 
      'FastAPI', 'Node.js', 'Solidity', 'Figma', 'Go', 'Tailwind', 'Docker', 'C++', 'Rust'
    ];

    const DOMAIN_KEYWORDS = {
      'Artificial Intelligence': ['ai', 'ml', 'machine learning', 'pytorch', 'tensorflow', 'deep learning', 'nlp', 'llm', 'python', 'vision', 'data science', 'fastapi', 'langchain'],
      'UI/UX & Frontend': ['ui', 'ux', 'frontend', 'design', 'figma', 'react', 'tailwind', 'vue', 'next.js', 'css', 'javascript', 'html', 'svelte', 'web'],
      'Web3 / Blockchain': ['web3', 'blockchain', 'solidity', 'ethereum', 'smart contract', 'rust', 'crypto', 'defi', 'zk', 'zero knowledge'],
      'Robotics & Autonomous': ['robot', 'autonomous', 'ros', 'ros2', 'opencv', 'vision', 'c++', 'control', 'drone', 'embedded', 'sensor', 'c'],
      'Cloud Infrastructure': ['cloud', 'infrastructure', 'devops', 'docker', 'kubernetes', 'aws', 'gcp', 'backend', 'go', 'golang', 'postgresql', 'distributed', 'systems'],
      'Full Stack & Web': ['full stack', 'backend', 'web', 'javascript', 'typescript', 'react', 'node', 'express', 'fastapi', 'rest', 'mongodb', 'sql']
    };

    function renderSkillChips(students) {
      const chipContainer = document.getElementById('skills-chips-container');
      if (!chipContainer) return;

      // Extract skills from registered students + popular preset
      const skillSet = new Set(POPULAR_SKILLS);
      students.forEach(s => {
        if (s.skills && Array.isArray(s.skills)) {
          s.skills.forEach(sk => skillSet.add(sk));
        }
      });

      const allChips = Array.from(skillSet).slice(0, 16);
      chipContainer.innerHTML = allChips.map(skill => {
        const isActive = activeSkill.toLowerCase() === skill.toLowerCase();
        return `
          <button onclick="setSkillFilter('${skill}')" class="px-2.5 py-1 rounded-full text-xs transition-all ${
            isActive 
              ? 'bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-500/30 border border-indigo-400 scale-105' 
              : 'bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 hover:border-indigo-500/30'
          }">
            ${isActive ? '✓ ' : ''}${skill}
          </button>
        `;
      }).join('');
    }

    function setSkillFilter(skill) {
      if (activeSkill.toLowerCase() === skill.toLowerCase()) {
        activeSkill = ''; // Toggle off
      } else {
        activeSkill = skill;
      }
      renderStudents();
    }

    function clearAllFilters() {
      document.getElementById('search-query').value = '';
      document.getElementById('filter-domain').value = '';
      document.getElementById('filter-exp').value = '';
      document.getElementById('filter-rating').value = '0';
      document.getElementById('filter-avail').value = '';
      document.getElementById('sort-by').value = 'match';
      activeSkill = '';
      renderStudents();
    }

    function computeStudentScore(s, query, domain, skillFilter) {
      let score = 50;
      let matchedSkills = [];
      let domainMatched = false;

      const studentSkillsLower = (s.skills || []).map(sk => sk.toLowerCase());
      const studentText = `${s.name} ${s.college} ${s.role} ${s.bio || ''} ${(s.domains || []).join(' ')} ${studentSkillsLower.join(' ')}`.toLowerCase();

      // 1. Skill Matching
      if (skillFilter) {
        const targetSkillLower = skillFilter.toLowerCase();
        const hasSkill = studentSkillsLower.some(sk => sk.includes(targetSkillLower) || targetSkillLower.includes(sk));
        if (hasSkill) {
          score += 60;
          matchedSkills.push(skillFilter);
        }
      }

      // Check search query terms
      if (query) {
        const queryTerms = query.split(/[\s,]+/).filter(Boolean);
        queryTerms.forEach(term => {
          if (studentSkillsLower.some(sk => sk.includes(term))) {
            score += 35;
            const originalSkill = (s.skills || []).find(sk => sk.toLowerCase().includes(term));
            if (originalSkill && !matchedSkills.includes(originalSkill)) {
              matchedSkills.push(originalSkill);
            }
          } else if (studentText.includes(term)) {
            score += 20;
          }
        });
      }

      // 2. Domain Track Matching
      if (domain) {
        const domainKeywords = DOMAIN_KEYWORDS[domain] || [domain.toLowerCase()];
        const domainInStudent = (s.domains || []).some(d => d.toLowerCase().includes(domain.toLowerCase()) || domain.toLowerCase().includes(d.toLowerCase()));
        const roleMatches = (s.role || '').toLowerCase().includes(domain.toLowerCase());
        const keywordsOverlap = domainKeywords.some(kw => studentText.includes(kw));

        if (domainInStudent || roleMatches || keywordsOverlap) {
          domainMatched = true;
          score += 45;
          // Add domain-related student skills to matchedSkills if not already there
          (s.skills || []).forEach(sk => {
            if (domainKeywords.includes(sk.toLowerCase()) && !matchedSkills.includes(sk)) {
              matchedSkills.push(sk);
            }
          });
        }
      }

      // 3. Quality & Rating Boost
      score += ((s.rating || 5.0) / 5.0) * 10;
      score += Math.min(10, ((s.credits || 0) / 200));

      const matchPercent = Math.min(99, Math.max(45, Math.round(score)));

      return {
        score,
        matchedSkills,
        domainMatched,
        matchPercent
      };
    }

    function renderStudents() {
      const query = document.getElementById('search-query').value.trim().toLowerCase();
      const domain = document.getElementById('filter-domain').value;
      const exp = document.getElementById('filter-exp').value;
      const minRating = Number(document.getElementById('filter-rating').value) || 0;
      const avail = document.getElementById('filter-avail').value;
      const sortBy = document.getElementById('sort-by').value;

      const students = window.TF_STORE.getStudents();
      const currentUser = window.TF_AUTH.getCurrentUser();

      renderSkillChips(students);

      // Score and Filter
      const processed = [];

      students.forEach(s => {
        const matchData = computeStudentScore(s, query, domain, activeSkill);

        // Filter by Query (if typed)
        if (query) {
          const studentText = `${s.name} ${s.college} ${s.role} ${s.bio || ''} ${(s.skills || []).join(' ')} ${(s.domains || []).join(' ')}`.toLowerCase();
          const queryTerms = query.split(/[\s,]+/).filter(Boolean);
          const matchesQuery = queryTerms.every(term => studentText.includes(term));
          if (!matchesQuery && matchData.matchedSkills.length === 0) return;
        }

        // Filter by Domain (if selected)
        if (domain) {
          if (!matchData.domainMatched) return;
        }

        // Filter by Active Skill Chip (if clicked)
        if (activeSkill) {
          const targetLower = activeSkill.toLowerCase();
          const hasSkill = (s.skills || []).some(sk => sk.toLowerCase().includes(targetLower) || targetLower.includes(sk.toLowerCase()));
          if (!hasSkill) return;
        }

        // Filter by Experience
        if (exp) {
          const expText = (s.experience || '').toLowerCase();
          if (!expText.includes(exp.toLowerCase())) return;
        }

        // Filter by Minimum Rating
        if ((s.rating || 0) < minRating) return;

        // Filter by Availability
        if (avail) {
          const availText = (s.availability || '').toLowerCase();
          if (!availText.includes(avail.toLowerCase())) return;
        }

        processed.push({
          student: s,
          ...matchData
        });
      });

      // Sorting
      processed.sort((a, b) => {
        if (sortBy === 'match') {
          return b.score - a.score;
        } else if (sortBy === 'skills') {
          return b.matchedSkills.length - a.matchedSkills.length || b.score - a.score;
        } else if (sortBy === 'rating') {
          return (b.student.rating || 0) - (a.student.rating || 0);
        } else if (sortBy === 'credits') {
          return (b.student.credits || 0) - (a.student.credits || 0);
        } else if (sortBy === 'name') {
          return a.student.name.localeCompare(b.student.name);
        }
        return b.score - a.score;
      });

      // Update Header Stats
      const countEl = document.getElementById('directory-count');
      const indicatorEl = document.getElementById('active-filter-indicator');
      const matchingPill = document.getElementById('matching-status-pill');

      if (countEl) {
        countEl.textContent = `Showing ${processed.length} of ${students.length} registered member${students.length === 1 ? '' : 's'}`;
      }

      if (activeSkill || domain || query) {
        matchingPill.classList.remove('hidden');
        if (indicatorEl) {
          indicatorEl.textContent = `Active: ${[activeSkill && `Skill "${activeSkill}"`, domain && `Domain "${domain}"`, query && `Search "${query}"`].filter(Boolean).join(' • ')}`;
        }
      } else {
        matchingPill.classList.add('hidden');
        if (indicatorEl) indicatorEl.textContent = '';
      }

      const container = document.getElementById('students-grid');

      if (processed.length === 0) {
        container.innerHTML = `
          <div class="col-span-full glass-card p-12 rounded-3xl text-center border-dashed border-white/20 space-y-3">
            <div class="text-4xl">🔍</div>
            <h3 class="font-heading text-lg font-bold text-white">No members matched the active filters</h3>
            <p class="text-xs text-slate-400 max-w-md mx-auto">
              ${students.length === 0 
                ? 'No students have registered an account yet. Create the first profile to start building squads!' 
                : 'Try clearing some search keywords or domain filters to view all registered peers.'}
            </p>
            <div class="pt-2 flex items-center justify-center gap-3">
              <button onclick="clearAllFilters()" class="btn-gradient px-4 py-2 rounded-xl text-xs font-bold">
                ↺ Reset All Filters
              </button>
              ${students.length === 0 ? `
                <a href="signup.html" class="glass-card px-4 py-2 rounded-xl text-xs font-bold text-white border border-white/10 hover:border-indigo-500/40">
                  + Create Account
                </a>
              ` : ''}
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = processed.map(item => {
        const s = item.student;
        const isSelf = currentUser && currentUser.id === s.id;
        const hasSkillOrDomainMatch = (domain || activeSkill || query) && item.matchedSkills.length > 0;

        return `
          <div class="glass-card p-5 rounded-2xl border ${isSelf ? 'border-indigo-500/50 bg-indigo-950/15' : 'border-white/5 hover:border-indigo-500/40'} flex flex-col justify-between space-y-4 relative overflow-hidden transition-all">
            
            ${(domain || activeSkill || query) ? `
              <!-- Relevance Match Badge -->
              <div class="flex items-center justify-between pb-2 border-b border-white/5 text-[11px] font-mono">
                <span class="inline-flex items-center gap-1 text-cyan-300 font-bold">
                  <span>✨</span> ${item.matchPercent}% Match
                </span>
                ${item.matchedSkills.length > 0 ? `
                  <span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full text-[10px]">
                    ${item.matchedSkills.length} Matching Skill${item.matchedSkills.length === 1 ? '' : 's'}
                  </span>
                ` : ''}
              </div>
            ` : ''}

            <!-- Student Header -->
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3">
                  <img src="${s.avatar}" alt="${s.name}" class="w-12 h-12 rounded-xl object-cover ring-2 ${isSelf ? 'ring-cyan-400' : 'ring-indigo-500/40'}">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <a href="profile.html?id=${s.id}" class="font-heading font-bold text-white hover:text-indigo-400 transition-colors">${s.name}</a>
                      ${isSelf ? '<span class="text-[10px] px-1.5 py-0.2 rounded bg-indigo-500/20 text-indigo-300 font-mono font-bold">(You)</span>' : ''}
                      ${s.verifiedBadge ? '<span class="text-cyan-400 text-xs" title="Verified Builder">✓</span>' : ''}
                    </div>
                    <div class="text-xs text-slate-400">${s.college}</div>
                  </div>
                </div>

                <div class="text-right shrink-0">
                  <div class="text-xs font-bold text-amber-400 flex items-center justify-end gap-1">
                    ★ ${s.rating} <span class="text-[10px] text-slate-500">(${s.reviewCount || 0})</span>
                  </div>
                  <div class="text-[10px] font-mono text-indigo-300">⚡ ${s.credits || 0} cr</div>
                </div>
              </div>

              <!-- Role & Bio -->
              <div class="mt-3">
                <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                  <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    ${s.role}
                  </span>
                  ${s.domains && s.domains.length > 0 ? `
                    <span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-400 font-mono">
                      ${s.domains[0]}
                    </span>
                  ` : ''}
                </div>
                <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${s.bio || 'Ambition student developer ready to collaborate on innovative projects.'}</p>
              </div>

              <!-- Skills Badges with Match Highlighting -->
              <div class="mt-3 flex flex-wrap gap-1.5">
                ${(s.skills || []).map(sk => {
                  const isSkillMatched = item.matchedSkills.some(ms => ms.toLowerCase() === sk.toLowerCase() || sk.toLowerCase().includes(ms.toLowerCase()));
                  return `
                    <span class="px-2 py-0.5 rounded-lg text-xs font-medium transition-all ${
                      isSkillMatched 
                        ? 'bg-indigo-500/30 text-cyan-200 border border-cyan-400/40 font-bold shadow-sm shadow-cyan-500/20' 
                        : 'skill-badge'
                    }">
                      ${isSkillMatched ? '⚡ ' : ''}${sk}
                    </span>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Card Actions -->
            <div class="pt-3 border-t border-white/5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                ${s.github ? `<a href="${s.github}" target="_blank" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs" title="GitHub">🐙</a>` : ''}
                ${s.linkedin ? `<a href="${s.linkedin}" target="_blank" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs" title="LinkedIn">💼</a>` : ''}
                <a href="profile.html?id=${s.id}" class="text-xs font-semibold text-slate-400 hover:text-white">Profile →</a>
              </div>

              ${!isSelf ? `
                <div class="flex items-center gap-1.5">
                  <button onclick="openInviteModal('${s.id}')" class="btn-gradient px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span>+ Invite</span>
                  </button>
                </div>
              ` : `
                <a href="profile.html?id=${s.id}" class="text-[11px] text-indigo-300 hover:underline font-mono">Edit Profile →</a>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function openInviteModal(studentId) {
      const student = window.TF_STORE.getStudentById(studentId);
      const user = window.TF_AUTH.getCurrentUser();
      const teams = window.TF_STORE.getTeams().filter(t => t.ownerId === user.id);

      if (teams.length === 0) {
        window.TF_STATE.toast("Create a team first", "You need to create a team before inviting members.", "warning");
        return;
      }

      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <img src="${student.avatar}" class="w-12 h-12 rounded-xl object-cover">
            <div>
              <h3 class="font-heading text-lg font-bold text-white">Invite ${student.name}</h3>
              <p class="text-xs text-indigo-300">${student.role} • ${student.college}</p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Select Destination Team</label>
            <select id="modal-team-select" class="glass-input w-full px-3 py-2 rounded-xl text-sm">
              ${teams.map(t => `<option value="${t.id}">${t.name} (${t.domain})</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Collaboration Type</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="glass-card p-3 rounded-xl border border-white/10 flex items-center gap-2 text-xs cursor-pointer">
                <input type="radio" name="invite-type" value="core" checked class="text-indigo-600">
                <div>
                  <div class="font-bold text-white">Core Member</div>
                  <div class="text-[10px] text-slate-400">Full workspace access</div>
                </div>
              </label>
              <label class="glass-card p-3 rounded-xl border border-white/10 flex items-center gap-2 text-xs cursor-pointer">
                <input type="radio" name="invite-type" value="guest" class="text-amber-500">
                <div>
                  <div class="font-bold text-amber-300">Guest Specialist</div>
                  <div class="text-[10px] text-slate-400">Temporary advisory role</div>
                </div>
              </label>
            </div>
          </div>

          <button onclick="submitInvite('${studentId}')" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Send Team Invitation
          </button>
        </div>
      `);
    }

    function submitInvite(studentId) {
      const teamId = document.getElementById('modal-team-select').value;
      const isGuest = document.querySelector('input[name="invite-type"]:checked').value === 'guest';
      window.TF_TEAMS.inviteStudent(teamId, studentId, isGuest);
      window.TF_STATE.closeModal();
      renderStudents();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      window.TF_UI.initPage('discover');
      renderStudents();

      // Cloud Sync (if Supabase configured)
      if (window.TF_STORE && typeof window.TF_STORE.syncFromSupabase === 'function') {
        await window.TF_STORE.syncFromSupabase();
        renderStudents();
      }

      // Multi-tab sync: automatically re-render when new accounts are signed up in other tabs
      window.addEventListener('storage', (e) => {
        if (e.key === 'tf_students') {
          renderStudents();
        }
      });

      document.getElementById('search-query').addEventListener('input', renderStudents);
      document.getElementById('filter-domain').addEventListener('change', renderStudents);
      document.getElementById('filter-exp').addEventListener('change', renderStudents);
      document.getElementById('filter-rating').addEventListener('change', renderStudents);
      document.getElementById('filter-avail').addEventListener('change', renderStudents);
      document.getElementById('sort-by').addEventListener('change', renderStudents);
    });
  </script>
</body>
</html>
