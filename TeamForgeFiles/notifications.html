<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — TeamForge</title>
  <meta name="description" content="Manage your team invitations, join requests, review alerts, and task updates.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen relative selection:bg-indigo-500 selection:text-white">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Navbar -->
  <div id="teamforge-navbar"></div>

  <div class="max-w-7xl mx-auto flex">
    <!-- Sidebar -->
    <div id="teamforge-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 space-y-6 min-w-0 max-w-4xl">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="font-heading text-2xl sm:text-3xl font-black text-white">
            Notifications & Alerts
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            Stay updated on squad requests, guest invitations, and peer review badges.
          </p>
        </div>

        <button onclick="markAllRead()" class="text-xs font-semibold text-indigo-400 hover:underline">
          Mark all as read
        </button>
      </div>

      <div id="notifications-list" class="space-y-3">
        <!-- Populated via JS -->
      </div>
    </main>
  </div>

  <div id="teamforge-footer"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.TF_AUTH.requireAuth('login.html');
      window.TF_UI.initPage('notifications');
      renderNotifications();
    });

    function renderNotifications() {
      const user = window.TF_AUTH.getCurrentUser();
      const notifs = window.TF_STORE.getNotifications(user ? user.id : null);
      const container = document.getElementById('notifications-list');

      if (notifs.length === 0) {
        container.innerHTML = `<div class="glass-card p-12 text-center text-xs text-slate-500 italic">No notifications right now.</div>`;
        return;
      }

      container.innerHTML = notifs.map(n => `
        <div class="glass-card p-4 rounded-2xl border ${!n.isRead ? 'border-indigo-500/30 bg-indigo-950/20' : 'border-white/5'} flex items-start justify-between gap-4 transition-all">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-300 flex items-center justify-center text-sm shrink-0">
              ${n.type === 'review' ? '⭐' : n.type === 'task' ? '📋' : '🚀'}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-xs sm:text-sm text-white">${n.title}</h3>
                ${!n.isRead ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>' : ''}
              </div>
              <p class="text-xs text-slate-300 mt-0.5 leading-relaxed">${n.message}</p>
              <span class="text-[10px] text-slate-500 font-mono mt-1 block">${n.timestamp ? n.timestamp.slice(0, 10) : ''}</span>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            ${n.actionUrl ? `
              <a href="${n.actionUrl}" onclick="window.TF_STORE.markNotificationRead('${n.id}')" class="btn-gradient px-3 py-1.5 rounded-lg text-xs font-bold">
                View →
              </a>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    function markAllRead() {
      const user = window.TF_AUTH.getCurrentUser();
      const notifs = window.TF_STORE.getNotifications(user ? user.id : null);
      notifs.forEach(n => window.TF_STORE.markNotificationRead(n.id));
      window.TF_STATE.toast("Updated", "All notifications marked as read", "info");
      renderNotifications();
    }
  </script>
</body>
</html>
