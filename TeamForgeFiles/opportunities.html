<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities & Specialist Postings — TeamForge</title>
  <meta name="description" content="Browse open specialist roles, guest contributor requests, and hackathon squad openings with credit bounties.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen relative selection:bg-indigo-500 selection:text-white">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Navbar -->
  <div id="teamforge-navbar"></div>

  <div class="max-w-7xl mx-auto flex">
    <!-- Sidebar -->
    <div id="teamforge-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 space-y-6 min-w-0">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="font-heading text-2xl sm:text-3xl font-black text-white flex items-center gap-2">
            📢 Specialist & Project Opportunities Feed
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            Apply to guest specialist roles, earn reputation credits, and help other teams ship winning projects.
          </p>
        </div>

        <button onclick="openPostOpportunityModal()" class="btn-gradient self-start sm:self-auto px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-indigo-600/30">
          <span>+ Post Opportunity</span>
        </button>
      </div>

      <!-- Opportunities Feed List -->
      <div id="opportunities-list" class="space-y-4">
        <!-- Populated via JS -->
      </div>
    </main>
  </div>

  <div id="teamforge-footer"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/events.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.TF_UI.initPage('opportunities');
      renderOpportunities();
    });

    function renderOpportunities() {
      const opps = window.TF_STORE.getOpportunities();
      const container = document.getElementById('opportunities-list');

      if (opps.length === 0) {
        container.innerHTML = `<div class="glass-card p-12 text-center text-xs text-slate-500">No open specialist opportunities posted yet.</div>`;
        return;
      }

      container.innerHTML = opps.map(o => `
        <div class="glass-card p-6 rounded-3xl border border-white/5 hover:border-indigo-500/40 space-y-4 transition-all">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
              <img src="${o.authorAvatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + o.authorName}" class="w-12 h-12 rounded-2xl object-cover ring-2 ring-indigo-500/40">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono font-bold text-rose-400 uppercase tracking-wider">${o.type}</span>
                  <span class="text-slate-500">•</span>
                  <span class="text-xs font-semibold text-indigo-300">${o.teamName}</span>
                </div>
                <h3 class="font-heading text-lg font-bold text-white mt-0.5">${o.title}</h3>
              </div>
            </div>

            <div class="flex sm:flex-col items-center sm:items-end justify-between gap-2 border-t sm:border-none pt-2 sm:pt-0 border-white/5">
              <div class="text-right">
                <span class="text-xs font-mono font-bold text-emerald-400">⚡ ${o.creditsReward} cr Bounty</span>
                <div class="text-[10px] text-slate-500">Deadline: ${o.deadline}</div>
              </div>
              <button onclick="openApplyModal('${o.id}')" class="btn-gradient px-4 py-2 rounded-xl text-xs font-bold">
                Apply / Express Interest
              </button>
            </div>
          </div>

          <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${o.description}</p>

          <div class="pt-3 border-t border-white/5 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-slate-500 mr-1">Required Skills:</span>
              ${(o.requiredSkills || []).map(s => `<span class="skill-badge">${s}</span>`).join('')}
            </div>

            <div class="text-slate-400 font-mono text-[11px]">
              👥 ${o.applicantCount || 0} applicants so far
            </div>
          </div>
        </div>
      `).join('');
    }

    function openApplyModal(oppId) {
      const opp = window.TF_STORE.getOpportunities().find(o => o.id === oppId);
      if (!opp) return;

      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <h3 class="font-heading text-lg font-bold text-white">Apply for Role</h3>
          <p class="text-xs text-indigo-300">${opp.title} — ${opp.teamName}</p>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Brief Note / Pitch</label>
            <textarea id="apply-note" rows="3" placeholder="Explain your relevant experience and why you are excited to help..." class="glass-input w-full px-3 py-2 rounded-xl text-xs"></textarea>
          </div>

          <button onclick="submitApplication('${oppId}')" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Submit Application
          </button>
        </div>
      `);
    }

    function submitApplication(oppId) {
      const note = document.getElementById('apply-note').value.trim();
      window.TF_EVENTS.applyToOpportunity(oppId, note);
      window.TF_STATE.closeModal();
      renderOpportunities();
    }

    function openPostOpportunityModal() {
      const user = window.TF_AUTH.getCurrentUser();
      const myTeams = window.TF_STORE.getTeams().filter(t => t.ownerId === user.id);

      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <h3 class="font-heading text-lg font-bold text-white">Post Specialist Opportunity</h3>
          
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Opportunity Title *</label>
            <input type="text" id="opp-title" required placeholder="e.g. Looking for WebGL / Three.js Frontend Specialist" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Associated Team</label>
            <select id="opp-team" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
              ${myTeams.length > 0 ? myTeams.map(t => `<option value="${t.id}">${t.name}</option>`).join('') : '<option value="">Independent Project Squad</option>'}
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Role Type</label>
            <select id="opp-type" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
              <option value="Temporary Specialist">Temporary Specialist (48-72 hrs)</option>
              <option value="Guest Contributor">Guest Contributor</option>
              <option value="Core Member">Permanent Core Member</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Required Skills (comma separated)</label>
            <input type="text" id="opp-skills" placeholder="e.g. React, Three.js, WebGL" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Description & Deliverables</label>
            <textarea id="opp-desc" rows="3" placeholder="Detail the task scope and timeline..." class="glass-input w-full px-3 py-2 rounded-xl text-xs"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Reputation Credits Reward</label>
            <input type="number" id="opp-credits" value="300" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <button onclick="submitNewOpportunity()" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Publish Opportunity
          </button>
        </div>
      `);
    }

    function submitNewOpportunity() {
      const title = document.getElementById('opp-title').value.trim();
      const desc = document.getElementById('opp-desc').value.trim();
      const type = document.getElementById('opp-type').value;
      const skills = document.getElementById('opp-skills').value;
      const credits = document.getElementById('opp-credits').value;
      const teamId = document.getElementById('opp-team').value;

      if (!title || !desc) {
        window.TF_STATE.toast("Required fields", "Please provide title and description", "warning");
        return;
      }

      window.TF_EVENTS.postOpportunity({
        title: title,
        description: desc,
        type: type,
        requiredSkills: skills,
        creditsReward: credits,
        teamId: teamId
      });

      window.TF_STATE.closeModal();
      renderOpportunities();
    }
  </script>
</body>
</html>
