<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile & Reviews — TeamForge</title>
  <meta name="description" content="View student technical skills, verified peer reviews, hackathon projects, and reputation credits.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen relative selection:bg-indigo-500 selection:text-white">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-3"></div>

  <!-- Top Navbar -->
  <div id="teamforge-navbar"></div>

  <div class="max-w-7xl mx-auto flex">
    <!-- Sidebar -->
    <div id="teamforge-sidebar"></div>

    <!-- Main Profile Content -->
    <main class="flex-1 p-4 lg:p-8 space-y-8 min-w-0">
      
      <!-- Profile Header Hero -->
      <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-white/10 relative overflow-hidden space-y-6 shadow-2xl">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
          <div class="flex items-start sm:items-center gap-5">
            <img id="prof-avatar" src="" alt="Profile Photo" class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl object-cover ring-4 ring-indigo-500/40 shadow-xl">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <h1 id="prof-name" class="font-heading text-2xl sm:text-3xl font-black text-white"></h1>
                <span id="prof-verified" class="text-cyan-400 text-sm font-bold" title="Verified Builder">✓</span>
                <span id="prof-role-badge" class="badge-lead px-3 py-0.5 rounded-full text-xs font-semibold"></span>
              </div>
              <p id="prof-college" class="text-xs sm:text-sm text-slate-400"></p>
              <div class="flex flex-wrap items-center gap-4 text-xs font-mono pt-1">
                <span class="text-amber-400 font-bold flex items-center gap-1">
                  ★ <span id="prof-rating">5.0</span> (<span id="prof-review-count">0</span> peer reviews)
                </span>
                <span class="text-indigo-300 flex items-center gap-1">
                  ⚡ <span id="prof-credits">0</span> Credits
                </span>
                <span class="text-emerald-400 flex items-center gap-1">
                  ● <span id="prof-availability">Available</span>
                </span>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-2.5 shrink-0 self-stretch sm:self-auto justify-end" id="profile-actions-container">
            <!-- Dynamically populated (Edit Profile vs Invite / Review) -->
          </div>
        </div>

        <!-- Bio -->
        <p id="prof-bio" class="text-sm text-slate-300 leading-relaxed border-t border-white/5 pt-4 max-w-4xl"></p>

        <!-- Social & Code Links -->
        <div class="flex flex-wrap items-center gap-3 text-xs pt-1" id="prof-links">
          <!-- Populated -->
        </div>
      </div>

      <!-- 2-Column Grid: Skills & Projects (Left) / Verified Reviews & Teams (Right) -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left 2 Cols: Tech Stack & Projects -->
        <div class="lg:col-span-2 space-y-8">
          
          <!-- Skills & Domains -->
          <div class="glass-panel p-6 rounded-3xl border border-white/10 space-y-4">
            <h2 class="font-heading text-lg font-bold text-white flex items-center gap-2">
              <span>🛠️ Core Technical Stack & Domains</span>
            </h2>
            <div id="prof-skills-container" class="flex flex-wrap gap-2">
              <!-- Skills -->
            </div>

            <div class="pt-3 border-t border-white/5">
              <span class="text-xs text-slate-400 font-medium mr-2">Focus Domains:</span>
              <span id="prof-domains-container" class="inline-flex flex-wrap gap-1.5 mt-1"></span>
            </div>
          </div>

          <!-- Past Projects Showcase -->
          <div class="glass-panel p-6 rounded-3xl border border-white/10 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-heading text-lg font-bold text-white flex items-center gap-2">
                <span>🚀 Featured Projects & Repos</span>
              </h2>
              <button id="add-project-btn" onclick="openAddProjectModal()" class="text-xs font-bold text-indigo-400 hover:text-indigo-300">+ Add Project</button>
            </div>

            <div id="prof-projects-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Projects -->
            </div>
          </div>

          <!-- Teams Collaborated In -->
          <div class="glass-panel p-6 rounded-3xl border border-white/10 space-y-4">
            <h2 class="font-heading text-lg font-bold text-white flex items-center gap-2">
              <span>👥 Teams & Hackathon Squads</span>
            </h2>
            <div id="prof-teams-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Teams -->
            </div>
          </div>
        </div>

        <!-- Right 1 Col: Verified Peer Reviews & Ratings -->
        <div class="space-y-6">
          <div class="glass-panel p-6 rounded-3xl border border-white/10 space-y-5">
            <div class="flex items-center justify-between border-b border-white/5 pb-3">
              <div>
                <h3 class="font-heading text-base font-bold text-white">Verified Peer Reviews</h3>
                <p class="text-[11px] text-slate-400">Reviews from hackathons & projects</p>
              </div>
              <button id="leave-review-btn" onclick="openReviewModal()" class="btn-gradient px-3 py-1.5 rounded-lg text-xs font-bold">
                + Review
              </button>
            </div>

            <!-- Reviews List -->
            <div id="prof-reviews-list" class="space-y-4">
              <!-- Populated dynamically -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="teamforge-footer"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/ui.js"></script>

  <script>
    let activeStudent = null;

    document.addEventListener('DOMContentLoaded', () => {
      window.TF_UI.initPage('profile');

      const urlParams = new URLSearchParams(window.location.search);
      let studentId = urlParams.get('id');
      const currentUser = window.TF_AUTH.getCurrentUser();

      if (!studentId && currentUser) {
        studentId = currentUser.id;
      }

      activeStudent = window.TF_STORE.getStudentById(studentId || 'usr_alex_01');
      if (!activeStudent) {
        window.location.href = 'discover.html';
        return;
      }

      renderProfile();
    });

    function renderProfile() {
      const s = activeStudent;
      const currentUser = window.TF_AUTH.getCurrentUser();
      const isSelf = currentUser && currentUser.id === s.id;

      const avatarSrc = (s.avatar && s.avatar.startsWith('http')) 
        ? s.avatar 
        : `https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=6366f1&color=fff&bold=true&size=128`;
      const avatarEl = document.getElementById('prof-avatar');
      avatarEl.src = avatarSrc;
      avatarEl.onerror = function() {
        this.onerror = null;
        this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=6366f1&color=fff&bold=true&size=128`;
      };

      document.getElementById('prof-name').textContent = s.name;
      document.getElementById('prof-role-badge').textContent = s.role;
      document.getElementById('prof-college').textContent = `${s.college || 'Sri Sairam college of Engineering'} • ${s.experience || 'Intermediate (2 yrs)'}`;
      document.getElementById('prof-rating').textContent = (s.rating !== undefined && s.rating !== null && !isNaN(Number(s.rating))) ? Number(s.rating).toFixed(1) : '5.0';
      document.getElementById('prof-review-count').textContent = s.reviewCount || 0;
      document.getElementById('prof-credits').textContent = s.credits || 200;
      document.getElementById('prof-availability').textContent = s.availability || 'Available';
      document.getElementById('prof-bio').textContent = s.bio;

      if (!s.verifiedBadge) {
        document.getElementById('prof-verified').style.display = 'none';
      }

      // Action Buttons
      const actionsContainer = document.getElementById('profile-actions-container');
      if (isSelf) {
        actionsContainer.innerHTML = `
          <button onclick="openEditProfileModal()" class="glass-card px-4 py-2 rounded-xl text-xs font-bold text-slate-200 hover:text-white border border-white/10 hover:border-indigo-500/40">
            ✏️ Edit Profile
          </button>
        `;
        document.getElementById('add-project-btn').style.display = 'inline-block';
        document.getElementById('leave-review-btn').style.display = 'none';
      } else {
        actionsContainer.innerHTML = `
          <button onclick="openInviteModal('${s.id}')" class="btn-gradient px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
            Invite to Team
          </button>
        `;
        document.getElementById('add-project-btn').style.display = 'none';
        document.getElementById('leave-review-btn').style.display = 'inline-block';
      }

      // Links
      const linksContainer = document.getElementById('prof-links');
      linksContainer.innerHTML = `
        ${s.github ? `<a href="${s.github}" target="_blank" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white flex items-center gap-1.5"><span>🐙</span> GitHub</a>` : ''}
        ${s.linkedin ? `<a href="${s.linkedin}" target="_blank" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white flex items-center gap-1.5"><span>💼</span> LinkedIn</a>` : ''}
        ${s.portfolio ? `<a href="${s.portfolio}" target="_blank" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white flex items-center gap-1.5"><span>🌐</span> Portfolio</a>` : ''}
      `;

      // Skills
      document.getElementById('prof-skills-container').innerHTML = (s.skills || []).map(sk => `
        <span class="skill-badge text-sm px-3 py-1">${sk}</span>
      `).join('');

      // Domains
      document.getElementById('prof-domains-container').innerHTML = (s.domains || []).map(d => `
        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">${d}</span>
      `).join('');

      // Projects
      const projectsContainer = document.getElementById('prof-projects-container');
      if (!s.projects || s.projects.length === 0) {
        projectsContainer.innerHTML = `<div class="col-span-2 text-xs text-slate-500 italic">No past projects listed yet.</div>`;
      } else {
        projectsContainer.innerHTML = s.projects.map(p => `
          <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-2">
            <div class="flex items-center justify-between">
              <div class="font-bold text-sm text-white">${p.name}</div>
              ${p.link ? `<a href="${p.link}" target="_blank" class="text-xs text-indigo-400 hover:underline">Code ↗</a>` : ''}
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">${p.desc}</p>
            <div class="flex flex-wrap gap-1 pt-1">
              ${(p.tags || []).map(t => `<span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-300">${t}</span>`).join('')}
            </div>
          </div>
        `).join('');
      }

      // Teams
      const allTeams = window.TF_STORE.getTeams();
      const userTeams = allTeams.filter(t => t.members.some(m => m.userId === s.id) || (t.guests && t.guests.some(g => g.userId === s.id)));
      const teamsContainer = document.getElementById('prof-teams-container');

      if (userTeams.length === 0) {
        teamsContainer.innerHTML = `<div class="col-span-2 text-xs text-slate-500 italic">No public teams found.</div>`;
      } else {
        teamsContainer.innerHTML = userTeams.map(t => {
          const isGuest = t.guests && t.guests.some(g => g.userId === s.id);
          return `
            <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-mono font-bold text-indigo-400 uppercase">${t.domain}</span>
                ${isGuest ? '<span class="badge-guest px-2 py-0.5 rounded text-[10px]">Guest Specialist</span>' : '<span class="badge-lead px-2 py-0.5 rounded text-[10px]">Core Member</span>'}
              </div>
              <div class="font-bold text-sm text-white">${t.name}</div>
              <p class="text-xs text-slate-400 line-clamp-1">${t.tagline || t.description}</p>
            </div>
          `;
        }).join('');
      }

      // Reviews
      const reviews = window.TF_STORE.getReviews(s.id);
      const reviewsList = document.getElementById('prof-reviews-list');

      if (reviews.length === 0) {
        reviewsList.innerHTML = `<div class="text-xs text-slate-500 italic text-center py-4">No reviews yet. Be the first to collaborate and leave a review!</div>`;
      } else {
        reviewsList.innerHTML = reviews.map(r => `
          <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <img src="${r.authorAvatar}" class="w-7 h-7 rounded-lg object-cover">
                <div>
                  <div class="text-xs font-bold text-white">${r.authorName}</div>
                  <div class="text-[10px] text-slate-400">${r.teamName || 'Hackathon Squad'}</div>
                </div>
              </div>
              <div class="text-xs font-bold text-amber-400">★ ${r.rating}</div>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed italic">"${r.comment}"</p>
            <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1">
              <span class="text-indigo-400 font-mono">+${r.creditsAwarded || 50} Credits Awarded</span>
              <span>${r.createdAt}</span>
            </div>
          </div>
        `).join('');
      }
    }

    function openEditProfileModal() {
      const s = activeStudent;
      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <h3 class="font-heading text-lg font-bold text-white">Edit Your Profile</h3>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
              <input type="text" id="edit-name" value="${s.name}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">University</label>
              <input type="text" id="edit-college" value="${s.college}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Primary Role</label>
              <input type="text" id="edit-role" value="${s.role}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Availability</label>
              <input type="text" id="edit-avail" value="${s.availability}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Skills (comma separated)</label>
            <input type="text" id="edit-skills" value="${s.skills.join(', ')}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Bio</label>
            <textarea id="edit-bio" rows="3" class="glass-input w-full px-3 py-2 rounded-xl text-xs">${s.bio}</textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub URL</label>
              <input type="url" id="edit-github" value="${s.github || ''}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">LinkedIn URL</label>
              <input type="url" id="edit-linkedin" value="${s.linkedin || ''}" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>
          </div>

          <button onclick="saveProfileChanges()" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Save Profile
          </button>
        </div>
      `);
    }

    function saveProfileChanges() {
      activeStudent.name = document.getElementById('edit-name').value.trim();
      activeStudent.college = document.getElementById('edit-college').value.trim();
      activeStudent.role = document.getElementById('edit-role').value.trim();
      activeStudent.availability = document.getElementById('edit-avail').value.trim();
      activeStudent.skills = document.getElementById('edit-skills').value.split(',').map(s => s.trim()).filter(Boolean);
      activeStudent.bio = document.getElementById('edit-bio').value.trim();
      activeStudent.github = document.getElementById('edit-github').value.trim();
      activeStudent.linkedin = document.getElementById('edit-linkedin').value.trim();

      window.TF_STORE.saveStudent(activeStudent);
      window.TF_STATE.closeModal();
      window.TF_STATE.toast("Profile Saved", "Your information has been updated successfully.", "success");
      renderProfile();
    }

    function openReviewModal() {
      const s = activeStudent;
      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <img src="${s.avatar}" class="w-10 h-10 rounded-xl object-cover">
            <div>
              <h3 class="font-heading text-base font-bold text-white">Review ${s.name}</h3>
              <p class="text-xs text-slate-400">Provide verified peer feedback and award credits.</p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Star Rating</label>
            <select id="review-stars" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
              <option value="5.0">⭐⭐⭐⭐⭐ 5.0 - Outstanding Technical Partner</option>
              <option value="4.8">⭐⭐⭐⭐ 4.8 - Excellent Contributor</option>
              <option value="4.5">⭐⭐⭐⭐ 4.5 - Good Teammate</option>
              <option value="4.0">⭐⭐⭐⭐ 4.0 - Solid Collaboration</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Project / Team Name</label>
            <input type="text" id="review-team-name" value="Hackathon Squad" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Written Review</label>
            <textarea id="review-comment" rows="3" placeholder="Explain what technical strengths this student brought to the table..." class="glass-input w-full px-3 py-2 rounded-xl text-xs"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Reputation Credits to Award</label>
            <select id="review-credits" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
              <option value="100">⚡ 100 Credits (Standard)</option>
              <option value="150">⚡ 150 Credits (Exceptional Delivery)</option>
              <option value="200">⚡ 200 Credits (Hackathon MVP)</option>
            </select>
          </div>

          <button onclick="submitReviewAction()" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Submit Verified Review
          </button>
        </div>
      `);
    }

    function submitReviewAction() {
      const rating = document.getElementById('review-stars').value;
      const teamName = document.getElementById('review-team-name').value.trim();
      const comment = document.getElementById('review-comment').value.trim();
      const credits = document.getElementById('review-credits').value;

      if (!comment) {
        window.TF_STATE.toast("Review required", "Please write a brief comment describing your collaboration.", "warning");
        return;
      }

      window.TF_REVIEWS.submitReview({
        targetUserId: activeStudent.id,
        rating: rating,
        teamName: teamName,
        comment: comment,
        creditsAwarded: credits
      });

      window.TF_STATE.closeModal();
      activeStudent = window.TF_STORE.getStudentById(activeStudent.id);
      renderProfile();
    }

    function openInviteModal(studentId) {
      const student = window.TF_STORE.getStudentById(studentId);
      const user = window.TF_AUTH.getCurrentUser();
      const teams = window.TF_STORE.getTeams().filter(t => t.ownerId === user.id);

      if (teams.length === 0) {
        window.TF_STATE.toast("Create a team first", "You must own a team before inviting members.", "warning");
        return;
      }

      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <h3 class="font-heading text-base font-bold text-white">Invite ${student.name} to Team</h3>
          
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Target Team</label>
            <select id="modal-team-select" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
              ${teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Role Type</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="glass-card p-2 rounded-xl border border-white/10 flex items-center gap-2 text-xs cursor-pointer">
                <input type="radio" name="invite-type" value="core" checked class="text-indigo-600">
                <span>Core Member</span>
              </label>
              <label class="glass-card p-2 rounded-xl border border-white/10 flex items-center gap-2 text-xs cursor-pointer">
                <input type="radio" name="invite-type" value="guest" class="text-amber-500">
                <span>Guest Specialist</span>
              </label>
            </div>
          </div>

          <button onclick="submitInvite('${studentId}')" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Send Invitation
          </button>
        </div>
      `);
    }

    function submitInvite(studentId) {
      const teamId = document.getElementById('modal-team-select').value;
      const isGuest = document.querySelector('input[name="invite-type"]:checked').value === 'guest';
      window.TF_TEAMS.inviteStudent(teamId, studentId, isGuest);
      window.TF_STATE.closeModal();
    }
  </script>
</body>
</html>
