<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams & Hackathon Squads — TeamForge</title>
  <meta name="description" content="Discover teams building projects for upcoming hackathons. Send join requests or recruit members.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen relative selection:bg-indigo-500 selection:text-white">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Navbar -->
  <div id="teamforge-navbar"></div>

  <div class="max-w-7xl mx-auto flex">
    <!-- Sidebar -->
    <div id="teamforge-sidebar"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 space-y-6 min-w-0">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="font-heading text-2xl sm:text-3xl font-black text-white flex items-center gap-2">
            Browse Active Teams & Squads
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            Join innovative student squads or request to contribute as a guest specialist.
          </p>
        </div>

        <a href="create-team.html" class="btn-gradient self-start sm:self-auto px-5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-indigo-600/30">
          <span>+ Create New Team</span>
        </a>
      </div>

      <!-- Filters & Search -->
      <div class="glass-panel p-4 rounded-2xl border border-white/10 flex flex-col sm:flex-row items-center gap-3">
        <div class="relative flex-1 w-full">
          <input type="text" id="team-search" placeholder="Search teams by project name, stack, or target hackathon..." class="glass-input w-full pl-9 pr-4 py-2 rounded-xl text-xs">
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <select id="filter-team-domain" class="glass-input w-full sm:w-48 px-3 py-2 rounded-xl text-xs">
          <option value="">All Domains</option>
          <option value="Artificial Intelligence">Artificial Intelligence</option>
          <option value="Sustainability">Sustainability / Climate</option>
          <option value="Computer Vision">Computer Vision & Robotics</option>
          <option value="Web3">Web3 / Blockchain</option>
        </select>
      </div>

      <!-- Teams Grid -->
      <div id="teams-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
        <!-- Populated via JS -->
      </div>
    </main>
  </div>

  <div id="teamforge-footer"></div>

  <!-- Scripts -->
  <script src="js/env.js" onerror="this.remove()"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.TF_UI.initPage('teams');
      renderTeams();

      document.getElementById('team-search').addEventListener('input', renderTeams);
      document.getElementById('filter-team-domain').addEventListener('change', renderTeams);
    });

    function renderTeams() {
      const search = document.getElementById('team-search').value.toLowerCase();
      const domain = document.getElementById('filter-team-domain').value;

      const teams = window.TF_STORE.getTeams();
      const currentUser = window.TF_AUTH.getCurrentUser();

      const filtered = teams.filter(t => {
        const matchesSearch = !search ||
          t.name.toLowerCase().includes(search) ||
          t.description.toLowerCase().includes(search) ||
          (t.hackathonTarget && t.hackathonTarget.toLowerCase().includes(search)) ||
          (t.requiredSkills && t.requiredSkills.some(s => s.toLowerCase().includes(search)));

        const matchesDomain = !domain || t.domain.includes(domain);
        return matchesSearch && matchesDomain;
      });

      const container = document.getElementById('teams-grid');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full glass-card p-12 rounded-3xl text-center border-dashed border-white/20">
            <h3 class="font-heading text-lg font-bold text-white">No teams match your search</h3>
            <p class="text-xs text-slate-400 mt-1">Be the first to launch a squad for this concept!</p>
            <a href="create-team.html" class="btn-gradient px-4 py-2 rounded-xl text-xs font-bold inline-block mt-4">+ Create Team</a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const owner = window.TF_STORE.getStudentById(t.ownerId) || { name: "Team Lead", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=lead" };
        const memberCount = (t.members?.length || 0) + (t.guests?.length || 0);
        const isMember = currentUser && (t.members?.some(m => m.userId === currentUser.id) || t.guests?.some(g => g.userId === currentUser.id));
        const hasRequested = currentUser && t.joinRequests?.some(r => r.userId === currentUser.id && r.status === 'pending');

        return `
          <div class="glass-card p-5 rounded-2xl border border-white/5 hover:border-indigo-500/40 flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-[10px] font-mono font-bold text-indigo-400 uppercase tracking-wider">${t.domain}</span>
                <span class="text-xs px-2 py-0.5 rounded bg-white/5 text-slate-300 font-mono">👥 ${memberCount}/${t.maxMembers}</span>
              </div>

              <h2 class="font-heading text-lg font-bold text-white mt-1">${t.name}</h2>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">${t.tagline || t.description}</p>

              ${t.hackathonTarget ? `
                <div class="mt-2.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-300 border border-amber-500/20 text-[11px] font-medium">
                  <span>🏆 Target:</span> <strong>${t.hackathonTarget}</strong>
                </div>
              ` : ''}

              <!-- Open Roles -->
              ${t.requiredRoles && t.requiredRoles.length > 0 ? `
                <div class="mt-3">
                  <div class="text-[11px] text-slate-400 font-medium mb-1">Looking for:</div>
                  <div class="flex flex-wrap gap-1">
                    ${t.requiredRoles.map(r => `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">${r}</span>`).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Required Skills -->
              <div class="mt-3 flex flex-wrap gap-1">
                ${(t.requiredSkills || []).slice(0, 4).map(s => `<span class="skill-badge">${s}</span>`).join('')}
              </div>
            </div>

            <!-- Footer Card -->
            <div class="pt-3 border-t border-white/5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <img src="${owner.avatar}" class="w-6 h-6 rounded-md object-cover ring-1 ring-indigo-500/40">
                <span class="text-xs text-slate-400 truncate">Lead: ${owner.name}</span>
              </div>

              ${isMember ? `
                <a href="team.html?id=${t.id}" class="btn-gradient px-3 py-1.5 rounded-lg text-xs font-bold">
                  Open Hub →
                </a>
              ` : hasRequested ? `
                <span class="text-xs text-amber-400 font-semibold px-2 py-1 rounded bg-amber-500/10 border border-amber-500/20">
                  Request Pending
                </span>
              ` : `
                <button onclick="openJoinRequestModal('${t.id}')" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 hover:text-white text-xs font-bold border border-indigo-500/30">
                  Request to Join
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function openJoinRequestModal(teamId) {
      const team = window.TF_STORE.getTeamById(teamId);
      window.TF_STATE.showModal(`
        <div class="space-y-4">
          <h3 class="font-heading text-lg font-bold text-white">Join ${team.name}</h3>
          <p class="text-xs text-slate-400">Introduce yourself and mention how your skills can help achieve the project's goals.</p>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Pitch / Introduction Note</label>
            <textarea id="join-message" rows="3" placeholder="Hey team! I have extensive experience in React and FastAPI and would love to build out the dashboard..." class="glass-input w-full px-3 py-2 rounded-xl text-xs"></textarea>
          </div>

          <button onclick="submitJoinRequest('${teamId}')" class="btn-gradient w-full py-2.5 rounded-xl text-xs font-bold">
            Submit Join Request
          </button>
        </div>
      `);
    }

    function submitJoinRequest(teamId) {
      const msg = document.getElementById('join-message').value.trim();
      window.TF_TEAMS.sendJoinRequest(teamId, msg);
      window.TF_STATE.closeModal();
      renderTeams();
    }
  </script>
</body>
</html>
